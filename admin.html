<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del Técnico - Gestión de Incidencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/latest/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

</head>
<body class="bg-gray-50 text-gray-900">

    <div id="backdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed top-0 left-0 z-50 h-full w-64 bg-white border-r border-gray-200 transition-transform -translate-x-full lg:translate-x-0">
        <div class="flex flex-col h-full">
            <div class="p-6 border-b border-gray-100">
                <h1 class="font-bold text-xl text-blue-600">Gestor Municipal</h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Panel de Administración</p>
            </div>
            
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="nav-links">
                </nav>

            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3 px-3 py-2 mb-2">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">AS</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate">Admin Sistema</p>
                        <p class="text-[10px] text-gray-500 truncate">admin@municipio.es</p>
                    </div>
                </div>
                <button class="w-full flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-lg text-sm transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </aside>

    <div class="lg:pl-64 min-h-screen flex flex-col">
        <header class="sticky top-0 z-30 lg:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <span class="font-bold text-blue-600">MuniciPanel</span>
            <div class="w-10"></div>
        </header>

        <main class="p-4 lg:p-8 flex-1" id="app-container">
            </main>
    </div>

    <div id="modal" class="modal fixed inset-0 z-[60] items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-2 hover:bg-gray-100 rounded-full">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modal-content" class="p-8"></div>
        </div>
    </div>

    <script>
        // ============= TODOS LOS DATOS MOCK DEL CÓDIGO ORIGINAL =============
        const mockIncidencias = [
            { id: 'INC001', titulo: 'Farola fundida en Calle Mayor', descripcion: 'La farola número 45 de Calle Mayor no funciona desde hace una semana. Se requiere cambio de bombilla o revisión de circuito.', categoria: 'alumbrado', estado: 'en_proceso', prioridad: 'alta', ubicacion: 'Calle Mayor, 45', ciudadanoNombre: 'María García López', tecnicoAsignadoNombre: 'Carlos Rodríguez', fechaCreacion: '2026-02-20T10:30:00', notas: ['Técnico asignado', 'Material solicitado'] },
            { id: 'INC002', titulo: 'Contenedores desbordados', descripcion: 'Los contenedores de basura en Plaza España llevan varios días sin recoger.', categoria: 'limpieza', estado: 'resuelta', prioridad: 'urgente', ubicacion: 'Plaza España', ciudadanoNombre: 'Juan Martínez', tecnicoAsignadoNombre: 'Ana Fernández', fechaCreacion: '2026-02-18T08:15:00', notas: ['Servicio notificado', 'Incidencia resuelta'] },
            { id: 'INC003', titulo: 'Banco roto en el Retiro', descripcion: 'Banco de madera roto y con riesgo de astillas en la zona infantil.', categoria: 'mobiliario', estado: 'pendiente', prioridad: 'media', ubicacion: 'Parque del Retiro', ciudadanoNombre: 'Laura Pérez', fechaCreacion: '2026-02-24T09:45:00', notas: [] },
            { id: 'INC004', titulo: 'Bache en Av. Libertad', descripcion: 'Bache de gran tamaño en el carril derecho que pone en riesgo los vehículos.', categoria: 'vias', estado: 'en_proceso', prioridad: 'alta', ubicacion: 'Avenida Libertad, km 2.3', ciudadanoNombre: 'Pedro González', tecnicoAsignadoNombre: 'Miguel Ángel Torres', fechaCreacion: '2026-02-21T16:20:00', notas: ['Inspección realizada'] },
            { id: 'INC005', titulo: 'Grifería sin agua en parque infantil', descripcion: 'Las fuentes de agua del parque infantil no están funcionando.', categoria: 'parques', estado: 'en_proceso', prioridad: 'media', ubicacion: 'Parque Infantil - Zona Norte', ciudadanoNombre: 'Roberto Sánchez', tecnicoAsignadoNombre: 'Carlos Rodríguez', fechaCreacion: '2026-02-25T13:00:00', notas: ['Válvula reabierta'] },
            { id: 'INC006', titulo: 'Cartel publicitario desprendido', descripcion: 'Un cartel publicitario se desprendió en la zona comercial.', categoria: 'mobiliario', estado: 'resuelta', prioridad: 'alta', ubicacion: 'Calle Comercio, 23', ciudadanoNombre: 'Susana López', tecnicoAsignadoNombre: 'Miguel Ángel Torres', fechaCreacion: '2026-02-19T15:30:00', notas: ['Cartel asegurado', 'Zona verificada'] },
            { id: 'INC007', titulo: 'Árbol caído en Parque Central', descripcion: 'Árbol de gran tamaño caído que bloquea paso peatonal.', categoria: 'parques', estado: 'en_proceso', prioridad: 'alta', ubicacion: 'Parque Central - Entrada Sur', ciudadanoNombre: 'Francisco Ruiz', tecnicoAsignadoNombre: 'Ana Fernández', fechaCreacion: '2026-02-26T10:00:00', notas: ['Maderera solicitada'] },
            { id: 'INC008', titulo: 'Semáforo amarillo siempre encendido', descripcion: 'El semáforo en la intersección de Av. Principal no cambia de color.', categoria: 'alumbrado', estado: 'pendiente', prioridad: 'media', ubicacion: 'Av. Principal - Calle 5', ciudadanoNombre: 'Ángel Moreno', fechaCreacion: '2026-02-26T14:30:00', notas: [] },
            { id: 'INC009', titulo: 'Fugas de agua en Calle Norte', descripcion: 'Se detectó fuga importante de agua potable en la acera.', categoria: 'infraestructura', estado: 'resuelta', prioridad: 'urgente', ubicacion: 'Calle Norte, 156', ciudadanoNombre: 'Valentina Costa', tecnicoAsignadoNombre: 'Miguel Ángel Torres', fechaCreacion: '2026-02-15T11:30:00', notas: ['Tubería reparada', 'Prueba completada'] },
            { id: 'INC010', titulo: 'Papelera rota en plaza', descripcion: 'Papelera pública rota y sin posibilidad de uso normal.', categoria: 'mobiliario', estado: 'pendiente', prioridad: 'media', ubicacion: 'Plaza Mayor', ciudadanoNombre: 'Dolores Ruiz', fechaCreacion: '2026-02-25T12:00:00', notas: [] },
            { id: 'INC011', titulo: 'Grietas en acera peatonal', descripcion: 'Grietas peligrosas detectadas en la acera de la zona residencial.', categoria: 'vias', estado: 'en_proceso', prioridad: 'media', ubicacion: 'Calle Residencial, 34', ciudadanoNombre: 'Guillermo Torres', tecnicoAsignadoNombre: 'Carlos Rodríguez', fechaCreacion: '2026-02-23T09:00:00', notas: ['Inspección realizada'] },
            { id: 'INC012', titulo: 'Jardinería necesaria - Poda urgente', descripcion: 'Árboles necesitan poda urgente para evitar ramas peligrosas.', categoria: 'parques', estado: 'resuelta', prioridad: 'media', ubicacion: 'Avenida Arboleda', ciudadanoNombre: 'Elena García', tecnicoAsignadoNombre: 'Ana Fernández', fechaCreacion: '2026-02-14T08:00:00', notas: ['Poda completada'] }
        ];

        const mockUsuarios = [
            { id: 'USR001', nombre: 'María García López', email: 'maria.garcia@email.com', rol: 'ciudadano', activo: true, fechaRegistro: '2025-11-10', stats: '5 reportadas' },
            { id: 'TEC001', nombre: 'Carlos Rodríguez', email: 'carlos.rodriguez@municipio.es', rol: 'tecnico', activo: true, fechaRegistro: '2025-01-15', stats: '45 resueltas' },
            { id: 'GEST001', nombre: 'Admin Sistema', email: 'admin@municipio.es', rol: 'gestor', activo: true, fechaRegistro: '2024-12-01', stats: '-' }
        ];

        let currentTab = 'dashboard';
        let sidebarOpen = false;

        // ============= LÓGICA DE NAVEGACIÓN =============
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            sidebar.classList.toggle('-translate-x-full', !sidebarOpen);
            backdrop.classList.toggle('hidden', !sidebarOpen);
        }

        function switchTab(tabId) {
            currentTab = tabId;
            if (window.innerWidth < 1024) toggleSidebar();
            renderApp();
        }

        // ============= RENDERS DE SECCIONES =============
        function renderApp() {
            const container = document.getElementById('app-container');
            const nav = document.getElementById('nav-links');
            
            // Renderizar Navegación
            const menuItems = [
                { id: 'dashboard', name: 'Panel Principal', icon: 'layout-dashboard' },
                { id: 'incidencias', name: 'Incidencias', icon: 'alert-triangle' },
                { id: 'usuarios', name: 'Usuarios', icon: 'users' },
                { id: 'configuracion', name: 'Configuración', icon: 'settings' }
            ];

            nav.innerHTML = menuItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all ${currentTab === item.id ? 'active-nav' : 'text-gray-600 hover:bg-gray-50'}">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i> ${item.name}
                </button>
            `).join('');

            // Renderizar Contenido según Tab
            switch(currentTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'incidencias': renderIncidencias(container); break;
                case 'usuarios': renderUsuarios(container); break;
                case 'configuracion': renderSettings(container); break;
            }
            lucide.createIcons();
        }

        // --- DASHBOARD ---
        function renderDashboard(container) {
            const stats = {
                total: mockIncidencias.length,
                pendientes: mockIncidencias.filter(i => i.estado === 'pendiente').length,
                resueltas: mockIncidencias.filter(i => i.estado === 'resuelta').length,
                urgentes: mockIncidencias.filter(i => i.prioridad === 'urgente').length
            };

            container.innerHTML = `
                <div class="space-y-8 fade-in">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                        <div>
                            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Panel de Control</h1>
                            <p class="text-gray-500 mt-1">Resumen general del estado del municipio.</p>
                        </div>
                        <div class="hidden md:flex items-center gap-3 bg-gradient-to-br from-indigo-200 via-blue-200 to-cyan-200 text-indigo-700 px-6 py-3 rounded-xl shadow-lg">
                            <i data-lucide="clipboard-list" class="h-6 w-6"></i>
                            <div class="text-right">
                                <p class="text-xs opacity-80 font-medium">Total activas</p>
                                <p class="text-2xl font-bold">${stats.total}</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${renderStatCard('Total Incidencias', stats.total, 'blue', 'alert-triangle')}
                        ${renderStatCard('Pendientes', stats.pendientes, 'orange', 'clock')}
                        ${renderStatCard('Resueltas', stats.resueltas, 'green', 'check-circle-2')}
                        ${renderStatCard('Urgentes', stats.urgentes, 'red', 'alert-circle')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <h3 class="font-bold mb-6 text-gray-700 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4 text-blue-500"></i> Evolución Mensual</h3>
                            <canvas id="chartEvolucion" height="200"></canvas>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <h3 class="font-bold mb-6 text-gray-700 flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-purple-500"></i> Por Categoría</h3>
                            <canvas id="chartCategorias" height="200"></canvas>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-gray-50 flex items-center justify-between">
                            <h3 class="font-bold text-gray-700 flex items-center gap-2">
                                <i data-lucide="history" class="w-5 h-5 text-blue-500"></i> Incidencias Recientes
                            </h3>
                            <button onclick="switchTab('incidencias')" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1">
                                Ver todas <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </button>
                        </div>
                        <div class="divide-y divide-gray-50">
                            ${mockIncidencias.slice(0, 5).map(inc => `
                                <div class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between group cursor-pointer" onclick="openModal('${inc.id}')">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 rounded-xl flex items-center justify-center ${getStatusColor(inc.estado)}">
                                            <i data-lucide="${getStatusIcon(inc.estado)}" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm font-bold text-gray-800 group-hover:text-blue-600 transition-colors">${inc.titulo}</p>
                                            <p class="text-xs text-gray-400 flex items-center gap-1">
                                                <i data-lucide="map-pin" class="w-3 h-3"></i> ${inc.ubicacion}
                                            </p>
                                        </div>
                                    </div>
                                    <div class="text-right hidden sm:block">
                                        <p class="text-xs font-bold text-gray-500">${inc.fechaCreacion.split('T')[0]}</p>
                                        <p class="text-[10px] text-gray-400 uppercase tracking-tighter">${inc.ciudadanoNombre}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            initDashboardCharts();
        }
        

        // --- INCIDENCIAS ---
        function renderIncidencias(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-3xl font-bold tracking-tight">Incidencias</h1>
                            <p class="text-gray-500">Gestión de reportes ciudadanos.</p>
                        </div>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-xl font-medium hover:bg-blue-700 transition-colors flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Reporte
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100 text-[10px] uppercase font-bold text-gray-400">
                                <tr>
                                    <th class="px-6 py-4">ID / Título</th>
                                    <th class="px-6 py-4">Estado</th>
                                    <th class="px-6 py-4">Prioridad</th>
                                    <th class="px-6 py-4">Ubicación</th>
                                    <th class="px-6 py-4">Fecha</th>
                                    <th class="px-6 py-4 text-right">Detalle</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${mockIncidencias.map(inc => `
                                    <tr class="hover:bg-blue-50/30 transition-colors">
                                        <td class="px-6 py-4">
                                            <p class="font-semibold text-sm">${inc.titulo}</p>
                                            <p class="text-xs text-gray-400 font-mono">${inc.id}</p>
                                        </td>
                                        <td class="px-6 py-4">${renderBadge(inc.estado)}</td>
                                        <td class="px-6 py-4 font-bold text-xs uppercase ${getPriorityColor(inc.prioridad)}">${inc.prioridad}</td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-1 text-xs text-gray-600">
                                                <i data-lucide="map-pin" class="w-3 h-3 text-gray-400"></i> ${inc.ubicacion}
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-xs text-gray-500">${inc.fechaCreacion.split('T')[0]}</td>
                                        <td class="px-6 py-4 text-right">
                                            <button onclick="openModal('${inc.id}')" class="text-blue-600 hover:bg-blue-100 p-2 rounded-lg transition-colors">
                                                <i data-lucide="eye" class="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- USUARIOS ---
        function renderUsuarios(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold tracking-tight">Directorio de Usuarios</h1>
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-[10px] font-bold text-gray-400 uppercase">
                                <tr>
                                    <th class="px-6 py-4">Usuario</th>
                                    <th class="px-6 py-4">Rol</th>
                                    <th class="px-6 py-4">Estado</th>
                                    <th class="px-6 py-4">Actividad</th>
                                    <th class="px-6 py-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50 text-sm">
                                ${mockUsuarios.map(u => `
                                    <tr>
                                        <td class="px-6 py-4 flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">
                                                ${u.nombre.substring(0,2).toUpperCase()}
                                            </div>
                                            <div>
                                                <p class="font-semibold">${u.nombre}</p>
                                                <p class="text-xs text-gray-400">${u.email}</p>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4"><span class="px-2 py-1 rounded bg-gray-100 text-[10px] font-bold uppercase tracking-tighter">${u.rol}</span></td>
                                        <td class="px-6 py-4"><span class="flex items-center gap-1 text-green-600 text-xs"><i data-lucide="circle" class="w-2 h-2 fill-current"></i> Activo</span></td>
                                        <td class="px-6 py-4 text-gray-500 text-xs">${u.stats}</td>
                                        <td class="px-6 py-4 text-right"><button class="text-gray-400 hover:text-blue-600"><i data-lucide="more-vertical" class="w-4 h-4"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- CONFIGURACIÓN ---
        function renderSettings(container) {
            container.innerHTML = `
                <div class="space-y-8 max-w-4xl">
                    <h1 class="text-3xl font-bold tracking-tight">Configuración del Sistema</h1>
                    
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b font-bold flex items-center gap-2"><i data-lucide="shield" class="w-5 h-5 text-blue-500"></i> Seguridad y Acceso</div>
                        <div class="p-6 space-y-6">
                            ${renderToggle("Autenticación 2FA", "Requiere un código adicional para entrar.")}
                            ${renderToggle("Cierre de sesión automático", "Cierra sesión tras 30 min de inactividad.")}
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="p-6 border-b font-bold flex items-center gap-2"><i data-lucide="globe" class="w-5 h-5 text-blue-500"></i> Regional</div>
                        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500 uppercase">Idioma del Sistema</label>
                                <select class="w-full bg-gray-50 border rounded-xl px-4 py-2 outline-none focus:ring-2 ring-blue-100 transition-all">
                                    <option>Español (ES)</option>
                                    <option>Català</option>
                                    <option>English (US)</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-500 uppercase">Zona Horaria</label>
                                <select class="w-full bg-gray-50 border rounded-xl px-4 py-2 outline-none focus:ring-2 ring-blue-100 transition-all">
                                    <option>Europa/Madrid (GMT+1)</option>
                                    <option>Atlantic/Canary (GMT+0)</option>
                                </select>
                            </div>
                        </div>
                        <div class="p-6 bg-gray-50 border-t flex justify-end">
                            <button class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition-all">Guardar Cambios</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============= HELPERS UI =============
        function renderStatCard(title, value, color, icon) {
            const styles = {
                blue: 'bg-blue-50 text-blue-600',
                orange: 'bg-orange-50 text-orange-600',
                green: 'bg-green-50 text-green-600',
                red: 'bg-red-50 text-red-600'
            };
            return `
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between hover:shadow-md transition-shadow">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">${title}</p>
                        <p class="text-3xl font-bold mt-1">${value}</p>
                    </div>
                    <div class="p-3 rounded-xl ${styles[color]}">
                        <i data-lucide="${icon}" class="w-6 h-6"></i>
                    </div>
                </div>
            `;
        }

        // Helpers para color e icono de estado
        function getStatusColor(estado) {
            if (estado === 'resuelta') return 'bg-green-100 text-green-600';
            if (estado === 'en_proceso') return 'bg-orange-100 text-orange-600';
            return 'bg-blue-100 text-blue-600';
        }
        function getStatusIcon(estado) {
            if (estado === 'resuelta') return 'check-circle-2';
            if (estado === 'en_proceso') return 'clock';
            return 'alert-circle';
        }

        function renderBadge(estado) {
            const config = {
                pendiente: { bg: 'bg-gray-100', text: 'text-gray-600', icon: 'clock' },
                en_proceso: { bg: 'bg-orange-100', text: 'text-orange-600', icon: 'alert-triangle' },
                resuelta: { bg: 'bg-green-100', text: 'text-green-600', icon: 'check-circle-2' }
            };
            const c = config[estado] || config.pendiente;
            return `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-tight ${c.bg} ${c.text}">
                    <i data-lucide="${c.icon}" class="w-3 h-3"></i> ${estado.replace('_', ' ')}
                </span>
            `;
        }

        function getPriorityColor(p) {
            if(p === 'urgente') return 'text-red-600';
            if(p === 'alta') return 'text-orange-600';
            return 'text-blue-600';
        }

        function renderToggle(label, desc) {
            return `
                <div class="flex items-center justify-between">
                    <div class="max-w-[80%]">
                        <p class="font-semibold text-sm">${label}</p>
                        <p class="text-xs text-gray-400">${desc}</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            `;
        }

        // --- LÓGICA DE MODAL ---
        function openModal(id) {
            const inc = mockIncidencias.find(i => i.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2">${renderBadge(inc.estado)}</div>
                        <h2 class="text-2xl font-bold">${inc.titulo}</h2>
                        <p class="text-gray-400 font-mono text-xs">ID de Seguimiento: ${inc.id}</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 py-6 border-y border-gray-100">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Ubicación</p>
                            <p class="font-medium text-sm mt-1 flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4 text-red-400"></i> ${inc.ubicacion}</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Prioridad</p>
                            <p class="font-bold text-sm mt-1 uppercase ${getPriorityColor(inc.prioridad)}">${inc.prioridad}</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Reportado por</p>
                            <p class="font-medium text-sm mt-1">${inc.ciudadanoNombre}</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Técnico Asignado</p>
                            <p class="font-medium text-sm mt-1">${inc.tecnicoAsignadoNombre || 'Sin asignar'}</p>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase mb-2">Descripción de la incidencia</p>
                        <p class="bg-gray-50 p-4 rounded-xl text-gray-700 text-sm leading-relaxed italic border border-gray-100">${inc.descripcion}</p>
                    </div>

                    ${inc.notas.length > 0 ? `
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase mb-2">Notas de Seguimiento</p>
                            <div class="space-y-2">
                                ${inc.notas.map(n => `<div class="p-3 bg-blue-50 rounded-lg text-xs text-blue-700 border border-blue-100">${n}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="pt-4 flex gap-3">
                        <button class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100">Asignar Personal</button>
                        <button class="flex-1 bg-white border border-gray-200 font-bold py-3 rounded-xl hover:bg-gray-50 transition-all">Archivar</button>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // --- GRÁFICAS ---
        function initDashboardCharts() {
            // Evolución Lineal
            new Chart(document.getElementById('chartEvolucion'), {
                type: 'line',
                data: {
                    labels: ['Ago', 'Sep', 'Oct', 'Nov', 'Dic', 'Ene', 'Feb'],
                    datasets: [
                        { label: 'Reportadas', data: [45, 52, 38, 48, 35, 42, 55], borderColor: '#3b82f6', backgroundColor: '#3b82f622', fill: true, tension: 0.4 },
                        { label: 'Resueltas', data: [38, 48, 35, 42, 32, 39, 45], borderColor: '#10b981', backgroundColor: '#10b98122', fill: true, tension: 0.4 }
                    ]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
            });

            // Categorías Pie
            new Chart(document.getElementById('chartCategorias'), {
                type: 'doughnut',
                data: {
                    labels: ['Limpieza', 'Alumbrado', 'Mobiliario', 'Vías', 'Transporte'],
                    datasets: [{
                        data: [85, 45, 38, 72, 28],
                        backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#8b5cf6']
                    }]
                },
                options: { cutout: '70%', plugins: { legend: { position: 'right' } } }
            });
        }

        // Inicializar App
        window.onload = () => switchTab('dashboard');
    </script>
</body>
</html>
