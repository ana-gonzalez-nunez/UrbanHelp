<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Municipal Pro - v3.0 (Data Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/api-client.js"></script>
    <script src="./js/user-data.js"></script>
    <script src="./js/logout-modal.js"></script>
    <link rel="stylesheet" href="./css/style_app.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .active-nav { background-color: #eff6ff; color: #1d4ed8; font-weight: 500; }
        .modal { display: none; background: rgba(0, 0, 0, 0.5); }
        .modal.active { display: flex; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">

    <div id="backdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed top-0 left-0 z-50 h-full w-64 bg-white border-r border-gray-200 transition-transform -translate-x-full lg:translate-x-0">
        <div class="flex flex-col h-full">
            <div class="p-6 border-b border-gray-100">
                <h1 class="font-bold text-xl text-blue-600">Gestor Municipal</h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Panel de Administración</p>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="nav-links"></nav>

            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3 px-3 py-2 mb-2">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">AS</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate">Admin Sistema</p>
                        <p class="text-[10px] text-gray-500 truncate">admin@municipio.es</p>
                    </div>
                </div>
                <button id="logoutBtn" class="w-full flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-lg text-sm transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </aside>

    <div class="lg:pl-64 min-h-screen flex flex-col">
        <header class="sticky top-0 z-30 lg:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu"></i></button>
            <span class="font-bold text-blue-600">MuniciPanel</span>
            <div class="w-10"></div>
        </header>

        <main class="p-4 lg:p-8 flex-1" id="app-container"></main>
    </div>

    <div id="modal" class="modal fixed inset-0 z-[60] items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative">
            <div id="modal-content" class="p-8"></div>
        </div>
    </div>

    <script>
        // Guard: si lucide no carga, evitar ReferenceError
        if (typeof lucide === 'undefined') {
            window.lucide = { createIcons: function() {} };
        }

        // --- ADAPTACIÓN DE DATOS ---
        // Como tu user-data.js usa 'mockIncidents', lo usamos globalmente
        let incidenciasActuales = typeof getIncidents === 'function' ? getIncidents() : [];
        
        let listaUsuarios = typeof getAppUsers === 'function' ? getAppUsers() : [];

        async function refreshUsers() {
            if (window.adminApi && typeof window.adminApi.listUsers === 'function') {
                try {
                    const users = await window.adminApi.listUsers();
                    if (Array.isArray(users)) {
                        listaUsuarios = users;
                        return;
                    }
                } catch {
                    // Fallback to local data below.
                }
            }

            if (typeof getAppUsers === 'function') {
                listaUsuarios = getAppUsers();
            }
        }

        async function refreshIncidents() {
            if (window.loadIncidentsFromApi && typeof window.loadIncidentsFromApi === 'function') {
                try {
                    await window.loadIncidentsFromApi();
                } catch {
                    // Keep local fallback.
                }
            }

            if (typeof getIncidents === 'function') {
                incidenciasActuales = getIncidents();
            }
        }

        let filtros = { texto: '', estado: 'todas', categoria: 'todas' };
        let currentTab = 'dashboard';
        let sidebarOpen = false;
        let editingId = null;
        let incidentsRefreshTimer = null;
        let incidentsEventSource = null;
        let incidentsRealtimeConnected = false;

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('-translate-x-full', !sidebarOpen);
            document.getElementById('backdrop').classList.toggle('hidden', !sidebarOpen);
        }

        function incidentHasAssignedTechnician(incident) {
            return !!(incident && incident.assignedTechnician && String(incident.assignedTechnician).trim());
        }

                function resolveIncidentDisplayTitle(incident) {
            var t = incident.titulo || incident.title || incident.description || '';
            return String(t).trim().slice(0, 80) || 'Incidencia sin titulo';
        }

                function getStatusBadge(status) {
            const map = {
                'pendiente':  ['bg-yellow-100 text-yellow-800', 'Pendiente'],
                'en-proceso': ['bg-blue-100 text-blue-800', 'En proceso'],
                'resuelta':   ['bg-green-100 text-green-800', 'Resuelta'],
                'cerrada':    ['bg-gray-100 text-gray-600', 'Cerrada'],
            };
            const entry = map[status] || ['bg-gray-100 text-gray-600', status || 'Desconocido'];
            return '<span class="px-2 py-1 rounded-full text-xs font-semibold ' + entry[0] + '">' + entry[1] + '</span>';
        }

        async function switchTab(tabId, id = null) {
            currentTab = tabId;
            editingId = id;
            await refreshIncidents();
            renderApp();
            window.scrollTo(0, 0);
        }

        async function syncIncidentsAndRerender() {
            await refreshIncidents();
            renderApp();
        }

        function stopIncidentsAutoRefresh() {
            if (incidentsRefreshTimer) clearInterval(incidentsRefreshTimer);
            incidentsRefreshTimer = null;
        }

        function startIncidentsAutoRefresh() {
            stopIncidentsAutoRefresh();

            // Fallback refresh when SSE is unavailable.
            incidentsRefreshTimer = setInterval(async () => {
                if (document.hidden) return;
                await syncIncidentsAndRerender();
            }, 5000);
        }

        function stopIncidentsRealtimeUpdates() {
            if (incidentsEventSource) {
                incidentsEventSource.close();
                incidentsEventSource = null;
            }
            incidentsRealtimeConnected = false;
        }

        function resolveIncidentsStreamUrl() {
            const protocol = window.location.protocol;
            const port = window.location.port;

            if (protocol === 'file:' || (port && port !== '80' && port !== '443' && port !== '8081')) {
                return 'http://localhost:8080/api/incidents/stream';
            }

            return '/api/incidents/stream';
        }

        function startIncidentsRealtimeUpdates() {
            if (!window.EventSource) {
                startIncidentsAutoRefresh();
                return;
            }

            stopIncidentsRealtimeUpdates();

            const streamUrl = resolveIncidentsStreamUrl();
            incidentsEventSource = new EventSource(streamUrl);

            incidentsEventSource.addEventListener('connected', async () => {
                incidentsRealtimeConnected = true;
                stopIncidentsAutoRefresh();
                await syncIncidentsAndRerender();
            });

            incidentsEventSource.addEventListener('incidents-updated', async () => {
                if (document.hidden) return;
                await syncIncidentsAndRerender();
            });

            incidentsEventSource.onerror = () => {
                incidentsRealtimeConnected = false;
                startIncidentsAutoRefresh();
            };
        }

        async function renderApp() {
            const container = document.getElementById('app-container');
            const nav = document.getElementById('nav-links');
            if (typeof getIncidents === 'function') {
                incidenciasActuales = getIncidents();
            }

            const menuItems = [
                { id: 'dashboard', name: 'Panel Principal', icon: 'layout-dashboard' },
                { id: 'incidencias', name: 'Incidencias', icon: 'alert-triangle' },
                { id: 'solicitudes', name: 'Buzón de Técnicos', icon: 'mailbox' },
                { id: 'usuarios', name: 'Usuarios', icon: 'users' },
                { id: 'configuracion', name: 'Configuración', icon: 'settings' }
            ];

            nav.innerHTML = menuItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all ${currentTab === item.id ? 'active-nav shadow-sm' : 'text-gray-600 hover:bg-gray-50'}">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i> ${item.name}
                </button>
            `).join('');

            container.innerHTML = '';
            switch (currentTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'incidencias': renderIncidencias(container); break;
                case 'solicitudes': await renderSolicitudes(container); break;
                case 'usuarios': await renderUsuarios(container); break;
                case 'configuracion': renderSettings(container); break;
                case 'edit-usuario': renderEditUsuario(container, editingId); break;
                case 'edit-incidencia': renderEditIncidencia(container, editingId); break;
            }
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        function renderDashboard(container) {
            const stats = {
                total: incidenciasActuales.length,
                pendientes: incidenciasActuales.filter(i => i.status === 'pendiente').length,
                resueltas: incidenciasActuales.filter(i => i.status === 'resuelta').length,
                urgentes: incidenciasActuales.filter(i => i.priority === 'alta').length
            };

            container.innerHTML = `
                <div class="space-y-8 fade-in">
                    <h1 class="text-3xl font-bold">Panel de Control</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${renderStatCard('Total Incidencias', stats.total, 'blue', 'alert-triangle')}
                        ${renderStatCard('Pendientes', stats.pendientes, 'orange', 'clock')}
                        ${renderStatCard('Resueltas', stats.resueltas, 'green', 'check-circle-2')}
                        ${renderStatCard('Urgentes/Altas', stats.urgentes, 'red', 'alert-circle')}
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border shadow-sm">
                            <h3 class="font-bold mb-6 text-gray-700">Métricas Semanales</h3>
                            <canvas id="chartEvolucion" height="180"></canvas>
                        </div>
                        <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                            <h3 class="font-bold p-6 border-b">Actividad Reciente</h3>
                            <div class="divide-y divide-gray-50">
                                ${incidenciasActuales.slice(0, 4).map(inc => `
                                    <div class="p-4 hover:bg-gray-50 cursor-pointer flex justify-between items-center" onclick="openModal('${inc.id}')">
                                        <div><p class="text-sm font-bold">${resolveIncidentDisplayTitle(inc)}</p><p class="text-xs text-gray-400">${inc.location}</p></div>
                                        ${getStatusBadge(inc.status)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            initDashboardCharts();
        }

        function renderIncidencias(container) {
            const filtradas = incidenciasActuales.filter(i => {
                const displayTitle = resolveIncidentDisplayTitle(i);
                const cumpleTexto = displayTitle.toLowerCase().includes(filtros.texto.toLowerCase()) || i.id.toLowerCase().includes(filtros.texto.toLowerCase());
                const cumpleEstado = filtros.estado === 'todas' || i.status === filtros.estado;
                const cumpleCat = filtros.categoria === 'todas' || i.category === filtros.categoria;
                return cumpleTexto && cumpleEstado && cumpleCat;
            });

            container.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div><h1 class="text-3xl font-bold">Incidencias</h1><p class="text-gray-500">Gestión urbana sincronizada.</p></div>
                        <button onclick="abrirFormularioReporte()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-blue-700 shadow-lg transition-all">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> Nuevo Reporte
                        </button>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border shadow-sm flex flex-col md:flex-row gap-4">
                        <div class="flex-1 relative">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="text" value="${filtros.texto}" oninput="actualizarFiltros('texto', this.value)" placeholder="Buscar por ID o Título..." class="w-full pl-10 pr-4 py-2 border rounded-xl outline-none focus:ring-2 ring-blue-100">
                        </div>
                        <select onchange="actualizarFiltros('estado', this.value)" class="border rounded-xl px-4 py-2 bg-gray-50 outline-none">
                            <option value="todas">Todos los Estados</option>
                            <option value="pendiente" ${filtros.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="en-proceso" ${filtros.estado === 'en-proceso' ? 'selected' : ''}>En Proceso</option>
                            <option value="resuelta" ${filtros.estado === 'resuelta' ? 'selected' : ''}>Resuelta</option>
                        </select>
                    </div>

                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-100 text-[10px] uppercase font-bold text-gray-400">
                                <tr>
                                    <th class="px-6 py-4">Título</th>
                                    <th class="px-6 py-4">Estado</th>
                                    <th class="px-6 py-4">Prioridad</th>
                                    <th class="px-6 py-4">Asignar</th>
                                    <th class="px-6 py-4 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm">
                                ${filtradas.map(inc => `
                                    <tr class="hover:bg-blue-50/20 transition-colors">
                                        <td class="px-6 py-4"><p class="font-bold">${resolveIncidentDisplayTitle(inc)}</p><p class="text-[10px] font-mono text-gray-400">${inc.id}</p></td>
                                        <td class="px-6 py-4">${getStatusBadge(inc.status)}</td>
                                        <td class="px-6 py-4 font-bold text-[10px] uppercase ${getPriorityColor(inc.priority)}">${inc.priority}</td>
                                        <td class="px-6 py-4">
                                            <button
                                                onclick="mostrarSelectorTecnicos('${inc.id}')"
                                                ${incidentHasAssignedTechnician(inc) ? 'disabled' : ''}
                                                class="px-3 py-1 rounded-lg text-xs font-bold transition-all ${incidentHasAssignedTechnician(inc) ? 'bg-green-100 text-green-700 cursor-not-allowed' : 'bg-gray-100 text-gray-600 hover:bg-blue-600 hover:text-white'}"
                                            >
                                                ${incidentHasAssignedTechnician(inc) ? 'Asignado' : 'Asignar'}
                                            </button>
                                        </td>
                                        <td class="px-6 py-4 text-right flex justify-end gap-1">
                                            <button onclick="openModal('${inc.id}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg"><i data-lucide="eye" class="w-4 h-4"></i></button>
                                            <button onclick="switchTab('edit-incidencia', '${inc.id}')" class="text-orange-600 hover:bg-orange-50 p-2 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        async function fetchSolicitudesTecnicos() {
            if (window.adminApi && typeof window.adminApi.listTechnicianRequests === 'function') {
                try {
                    return await window.adminApi.listTechnicianRequests();
                } catch {
                    return [];
                }
            }
            const solicitudes = typeof getTechnicianRequests === 'function' ? getTechnicianRequests() : [];
            return solicitudes.filter((s) => (s.status || 'pendiente') === 'pendiente');
        }

        async function renderSolicitudes(container) {
            const solicitudesPendientes = await fetchSolicitudesTecnicos();

            container.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <h1 class="text-3xl font-bold">Buzón de Solicitudes</h1>
                            <p class="text-gray-500">Aprobación de nuevos técnicos para la plataforma.</p>
                        </div>
                        <span class="bg-blue-100 text-blue-600 px-4 py-1 rounded-full text-sm font-bold">
                            ${solicitudesPendientes.length} Pendientes
                        </span>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        ${solicitudesPendientes.length > 0 ? solicitudesPendientes.map(sol => `
                            <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 hover:border-blue-300 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center">
                                        <i data-lucide="user-plus"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-lg">${sol.nombre}</h3>
                                        <p class="text-sm text-gray-500">${sol.email} • <span class="text-blue-600 font-medium">${sol.especialidad}</span></p>
                                        <p class="text-[10px] text-gray-400 uppercase mt-1 font-mono">ID: ${sol.id} • Recibida: ${sol.fecha}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2 w-full md:w-auto">
                                        <button onclick="gestionarSolicitud('${sol.id}', 'aceptar')" class="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-green-700 transition-all">
                                        <i data-lucide="check" class="w-4 h-4"></i> Aceptar
                                    </button>
                                        <button onclick="gestionarSolicitud('${sol.id}', 'rechazar')" class="flex-1 md:flex-none bg-white border border-red-200 text-red-600 px-4 py-2 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-red-50 transition-all">
                                        <i data-lucide="x" class="w-4 h-4"></i> Rechazar
                                    </button>
                                </div>
                            </div>
                        `).join('') : `
                            <div class="text-center py-20 bg-gray-50 rounded-2xl border-2 border-dashed">
                                <i data-lucide="inbox" class="w-12 h-12 text-gray-300 mx-auto mb-4"></i>
                                <p class="text-gray-500">No hay solicitudes pendientes en este momento.</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        async function gestionarSolicitud(id, accion) {
            const confirmacion = confirm(`¿Estás seguro de que deseas ${accion} esta solicitud?`);
            if (confirmacion) {
                if (window.adminApi) {
                    try {
                        if (accion === 'aceptar' && typeof window.adminApi.approveTechnicianRequest === 'function') {
                            await window.adminApi.approveTechnicianRequest(id);
                        }
                        if (accion === 'rechazar' && typeof window.adminApi.rejectTechnicianRequest === 'function') {
                            await window.adminApi.rejectTechnicianRequest(id);
                        }
                    } catch {
                        alert('No se pudo actualizar la solicitud en servidor.');
                        return;
                    }
                } else if (typeof resolveTechnicianRequest === 'function') {
                    resolveTechnicianRequest(id, accion === 'aceptar' ? 'aceptada' : 'rechazada');
                }

                if (accion === 'aceptar' && typeof getTechnicianRequests === 'function' && typeof upsertAppUser === 'function') {
                    const request = getTechnicianRequests().find((item) => item.id === id);
                    if (request) {
                        upsertAppUser({
                            nombre: request.nombre,
                            email: request.email,
                            rol: 'tecnico',
                            stats: '0 resueltas'
                        });
                        refreshUsers();
                    }
                }

                alert(`Solicitud ${id} ha sido ${accion === 'aceptar' ? 'aprobada con éxito. El técnico ya puede acceder.' : 'rechazada.'}`);
                switchTab('solicitudes'); 
            }
        }

        // --- EDICIÓN DE INCIDENCIA (CON NUEVOS CAMPOS) ---
        function renderEditIncidencia(container, incId) {
            const inc = incidenciasActuales.find(i => i.id === incId);
            container.innerHTML = `
                <div class="fade-in max-w-2xl mx-auto space-y-6">
                    <button onclick="switchTab('incidencias')" class="flex items-center gap-2 text-gray-500 hover:text-blue-600 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a lista
                    </button>
                    <div class="bg-white p-8 rounded-2xl border shadow-sm">
                        <h2 class="text-2xl font-bold mb-6">Editar Incidencia ${inc.id}</h2>
                        <form onsubmit="actualizarIncidenciaForm(event, '${inc.id}')" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Título</label>
                                <input type="text" name="title" value="${resolveIncidentDisplayTitle(inc)}" class="w-full border rounded-xl px-4 py-2 mt-1 outline-none focus:ring-2 ring-blue-100">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Estado</label>
                                <select name="status" class="w-full border rounded-xl px-4 py-2 mt-1 outline-none bg-gray-50">
                                    <option value="pendiente" ${inc.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                    <option value="en-proceso" ${inc.status === 'en-proceso' ? 'selected' : ''}>En Proceso</option>
                                    <option value="resuelta" ${inc.status === 'resuelta' ? 'selected' : ''}>Resuelta</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Prioridad</label>
                                <select name="priority" class="w-full border rounded-xl px-4 py-2 mt-1 outline-none bg-gray-50">
                                    <option value="baja" ${inc.priority === 'baja' ? 'selected' : ''}>Baja</option>
                                    <option value="media" ${inc.priority === 'media' ? 'selected' : ''}>Media</option>
                                    <option value="alta" ${inc.priority === 'alta' ? 'selected' : ''}>Alta</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Descripción</label>
                                <textarea name="description" rows="4" class="w-full border rounded-xl px-4 py-2 mt-1 outline-none focus:ring-2 ring-blue-100">${inc.description}</textarea>
                            </div>
                            <div class="md:col-span-2 pt-4 flex gap-3">
                                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700 transition-all">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>`;
        }

        function actualizarIncidenciaForm(event, incId) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const index = incidenciasActuales.findIndex(i => i.id === incId);
            
            incidenciasActuales[index] = {
                ...incidenciasActuales[index],
                title: formData.get('title'),
                status: formData.get('status'),
                priority: formData.get('priority'),
                description: formData.get('description')
            };
            
            saveIncidents(incidenciasActuales);
            alert('Cambios guardados en LocalStorage');
            switchTab('incidencias');
        }

        // --- USUARIOS ---
        async function renderUsuarios(container) {
            await refreshUsers();
            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <h1 class="text-3xl font-bold">Usuarios</h1>
                    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 border-b text-[10px] uppercase font-bold text-gray-400">
                                <tr>
                                    <th class="p-4">Usuario</th>
                                    <th class="p-4">Rol</th>
                                    <th class="p-4 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${listaUsuarios.map(u => `
                                    <tr class="border-b hover:bg-gray-50 transition-all">
                                        <td class="p-4 flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">${(u.nombre || 'U').substring(0,2)}</div>
                                            <div><p class="font-bold">${u.nombre}</p><p class="text-xs text-gray-400">${u.email}</p></div>
                                        </td>
                                        <td class="p-4"><span class="px-2 py-1 bg-gray-100 rounded text-[10px] font-bold uppercase">${u.rol}</span></td>
                                        <td class="p-4 text-right">
                                            <button onclick="switchTab('edit-usuario', '${u.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg">
                                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        function renderEditUsuario(container, userId) {
            const user = listaUsuarios.find(u => u.id === userId);
            if (!user) {
                container.innerHTML = `<div class="text-center p-10">Usuario no encontrado.</div>`;
                return;
            }
            container.innerHTML = `
                <div class="fade-in max-w-xl mx-auto space-y-6">
                    <button onclick="switchTab('usuarios')" class="flex items-center gap-2 text-gray-500 hover:text-blue-600 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                    </button>
                    <div class="bg-white p-8 rounded-2xl border shadow-sm space-y-6">
                        <h2 class="text-2xl font-bold">Editar Rol</h2>
                        <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-xl">
                            <div class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">${user.nombre.substring(0,2)}</div>
                            <div><p class="font-bold">${user.nombre}</p><p class="text-sm text-gray-500">${user.email}</p></div>
                        </div>
                        <form onsubmit="guardarRolForm(event, '${user.id}')" class="space-y-4">
                            <select name="rol" class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 ring-blue-100">
                                <option value="ciudadano" ${user.rol === 'ciudadano' ? 'selected' : ''}>Ciudadano</option>
                                <option value="tecnico" ${user.rol === 'tecnico' ? 'selected' : ''}>Técnico</option>
                                <option value="gestor" ${user.rol === 'gestor' ? 'selected' : ''}>Gestor</option>
                                <option value="admin" ${user.rol === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">Actualizar Rol</button>
                        </form>
                    </div>
                </div>`;
        }

        async function guardarRolForm(event, userId) {
            event.preventDefault();
            const nuevoRol = new FormData(event.target).get('rol');

            if (window.adminApi && typeof window.adminApi.updateUserRole === 'function') {
                try {
                    await window.adminApi.updateUserRole(userId, nuevoRol);
                    alert('Rol actualizado en base de datos');
                    switchTab('usuarios');
                    return;
                } catch {
                    alert('No se pudo actualizar el rol en servidor');
                    return;
                }
            }

            const idx = listaUsuarios.findIndex(u => u.id === userId);
            if (idx >= 0) listaUsuarios[idx].rol = nuevoRol;
            if (typeof saveAppUsers === 'function') saveAppUsers(listaUsuarios);
            alert('Rol actualizado localmente');
            switchTab('usuarios');
        }

        // --- ASIGNACIÓN ---
        async function mostrarSelectorTecnicos(id) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            await refreshUsers();
            const tecnicos = listaUsuarios.filter(u => u.rol === 'tecnico' && u.estadoCuenta !== false);
            const inc = incidenciasActuales.find(i => i.id === id);

            if (!inc) {
                alert('No se encontro la incidencia seleccionada.');
                return;
            }

            if (incidentHasAssignedTechnician(inc)) {
                alert('Esta incidencia ya tiene un técnico asignado.');
                return;
            }

            content.innerHTML = `
                <div class="space-y-6 fade-in relative">
                    <button onclick="closeModal()" class="absolute -top-2 -right-2 p-2 hover:bg-gray-100 rounded-full text-gray-400"><i data-lucide="x"></i></button>
                    <h2 class="text-xl font-bold">Asignar Técnico</h2>
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100"><p class="text-sm font-bold">${resolveIncidentDisplayTitle(inc)}</p></div>
                    <div class="space-y-2">
                        ${tecnicos.length === 0 ? `
                            <div class="p-4 border rounded-xl bg-gray-50 text-sm text-gray-600">
                                No hay técnicos activos disponibles para asignar.
                            </div>
                        ` : tecnicos.map(t => `
                            <div onclick="confirmarAsignacionT('${id}', '${t.id}', '${(t.nombre || '').replace(/'/g, "\\'")}')" class="flex items-center justify-between p-4 border rounded-xl hover:border-blue-500 hover:bg-blue-50 cursor-pointer group transition-all">
                                <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">${t.nombre.substring(0,2)}</div><div><p class="text-sm font-bold">${t.nombre}</p></div></div>
                                <i data-lucide="user-check" class="w-4 h-4 text-transparent group-hover:text-blue-600"></i>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            modal.classList.add('active');
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        async function confirmarAsignacionT(incId, tecId, tecNombre) {
            const index = incidenciasActuales.findIndex(i => i.id === incId);
            if (index < 0) {
                alert('No se encontro la incidencia seleccionada.');
                return;
            }

            if (incidentHasAssignedTechnician(incidenciasActuales[index])) {
                alert('Esta incidencia ya tiene un técnico asignado.');
                closeModal();
                return;
            }

            const numericIncidentId = Number(String(incId).replace('INC', ''));
            const numericTechnicianId = Number(tecId);

            if (window.incidentApi && typeof window.incidentApi.assignTechnician === 'function' && Number.isFinite(numericIncidentId) && Number.isFinite(numericTechnicianId)) {
                try {
                    await window.incidentApi.assignTechnician(numericIncidentId, numericTechnicianId);
                    if (window.loadIncidentsFromApi) {
                        await window.loadIncidentsFromApi();
                    }
                    await refreshIncidents();
                    closeModal();
                    renderApp();
                    return;
                } catch (error) {
                    const detail = (error && error.message ? error.message : 'No se pudo asignar tecnico en servidor').trim();
                    alert(detail);
                    return;
                }
            }

            incidenciasActuales[index].assignedTechnician = tecNombre;
            incidenciasActuales[index].assignedTechnicianId = Number.isFinite(numericTechnicianId) ? numericTechnicianId : null;
            incidenciasActuales[index].status = 'en-proceso';
            saveIncidents(incidenciasActuales);
            closeModal();
            renderApp();
        }

        // --- UTILIDADES ---
        function openModal(id) {
            const inc = incidenciasActuales.find(i => i.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="space-y-6 relative">
                    <button onclick="closeModal()" class="absolute -top-2 -right-2 p-2 hover:bg-gray-100 rounded-full text-gray-400"><i data-lucide="x"></i></button>
                    <div><div class="mb-2">${getStatusBadge(inc.status)}</div><h2 class="text-2xl font-bold">${resolveIncidentDisplayTitle(inc)}</h2></div>
                    <div class="grid grid-cols-2 gap-4 py-6 border-y border-gray-100 text-sm">
                        <div><p class="text-xs font-bold text-gray-400 uppercase">Ubicación</p><p class="font-bold">${inc.location}</p></div>
                        <div><p class="text-xs font-bold text-gray-400 uppercase">Ciudadano</p><p class="font-bold">${inc.citizenName || 'Anónimo'}</p></div>
                        <div><p class="text-xs font-bold text-gray-400 uppercase">Técnico</p><p class="font-bold">${inc.assignedTechnician || 'Sin asignar'}</p></div>
                    </div>
                    <div><p class="text-xs font-bold text-gray-400 uppercase mb-2">Descripción</p><p class="bg-gray-50 p-4 rounded-xl text-gray-600 text-sm border">${inc.description}</p></div>
                    <div class="flex gap-3">
                        <button onclick="mostrarSelectorTecnicos('${inc.id}')" ${incidentHasAssignedTechnician(inc) ? 'disabled' : ''} class="flex-1 font-bold py-3 rounded-xl shadow-lg ${incidentHasAssignedTechnician(inc) ? 'bg-green-100 text-green-700 cursor-not-allowed shadow-none' : 'bg-blue-600 text-white'}">${incidentHasAssignedTechnician(inc) ? 'Ya asignada' : 'Asignar Personal'}</button>
                        <button onclick="closeModal()" class="flex-1 border font-bold py-3 rounded-xl hover:bg-gray-50">Cerrar</button>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
            if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        function actualizarFiltros(campo, valor) {
            filtros[campo] = valor;
            renderIncidencias(document.getElementById('app-container'));
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function renderStatCard(title, value, color, icon) {
            const styles = { blue: 'bg-blue-50 text-blue-600', orange: 'bg-orange-50 text-orange-600', green: 'bg-green-50 text-green-600', red: 'bg-red-50 text-red-600' };
            return `<div class="bg-white p-6 rounded-2xl border shadow-sm flex items-center justify-between"><div class="flex-1"><p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${title}</p><p class="text-3xl font-bold mt-1">${value}</p></div><div class="p-3 rounded-xl ${styles[color]}"><i data-lucide="${icon}"></i></div></div>`;
        }

        function getPriorityColor(p) { return p === 'urgente' || p === 'alta' ? 'text-red-600' : 'text-blue-600'; }

        function renderSettings(container) {
            container.innerHTML = `<div class="fade-in space-y-8 max-w-2xl"><h1 class="text-3xl font-bold">Configuración</h1><div class="bg-white p-8 rounded-2xl border space-y-6">Panel de configuración v3.0</div></div>`;
        }

        function initDashboardCharts() {
            const ctx = document.getElementById('chartEvolucion');
            if(ctx) {
                new Chart(ctx, { type: 'line', data: { labels: ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'], datasets: [{ label: 'Reportes', data: [12, 19, 15, 8, 22, 5, 10], borderColor: '#3b82f6', tension: 0.4 }] }, options: { plugins: { legend: { display: false } } } });
            }
        }

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                const confirmed = window.confirmLogoutModal
                    ? await window.confirmLogoutModal({
                        title: 'Cerrar sesión',
                        message: '¿Deseas cerrar sesión ahora?',
                        confirmText: 'Si, cerrar',
                        cancelText: 'Cancelar'
                    })
                    : window.confirm('¿Deseas cerrar sesión?');
                if (confirmed) {
                    window.location.href = 'login.html';
                }
            });
        }

        window.onload = async () => {
            try {
                await refreshIncidents();
                await refreshUsers();
                renderApp();
                await switchTab('dashboard');
                startIncidentsRealtimeUpdates();
            } catch (err) {
                console.error('Admin init error:', err);
                const container = document.getElementById('app-container');
                if (container) {
                    container.innerHTML = `<div class="p-8 text-red-600 font-bold">Error al cargar el panel: ${err.message}. Revisa la consola del navegador (F12).</div>`;
                }
            }
        };

        window.addEventListener('focus', async () => {
            await syncIncidentsAndRerender();
        });

        window.addEventListener('storage', async (event) => {
            if (event.key !== 'urbanIncidents') return;
            await syncIncidentsAndRerender();
        });

        window.addEventListener('beforeunload', () => {
            stopIncidentsRealtimeUpdates();
            stopIncidentsAutoRefresh();
        });
    </script>
</body>

</html>
