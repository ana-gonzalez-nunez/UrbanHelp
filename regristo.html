<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro UrbanHelp</title>
    <link rel="stylesheet" href="./css/style_registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="login-card">
    <div class="login-decoration">
        <div class="circles-background">
            <img src="./Imganes/UrbanHelp.jpeg" alt="UrbanHelp Logo" class="laptop-icon">
        </div>
    </div>

    <div class="login-form-container">
        <h2>Crear Cuenta</h2>
        
        <form action="procesar_registro.php" method="POST">
            
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="nombre" placeholder="Nombre" maxlength="100" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <input type="text" name="apellido_1" placeholder="Primer Apellido" maxlength="100" required style="padding-left: 25px;">
                </div>
                <div class="input-group">
                    <input type="text" name="apellido_2" placeholder="Segundo Apellido" maxlength="100" style="padding-left: 25px;">
                </div>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Correo Electrónico" maxlength="150" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="contrasena" placeholder="Contraseña" maxlength="255" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" name="telefono" placeholder="Teléfono (Opcional)" maxlength="20">
            </div>

            <button type="submit" class="login-button">REGISTRARSE</button>
            
            <a href="login.html" class="create-account">¿Ya tienes cuenta? Inicia sesión</a>
        </form>
    </div>
</div>

</body>
</html>
