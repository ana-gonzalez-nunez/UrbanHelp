<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicie sesión en su cuenta</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/your-font-awesome-kit-code.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-decoration">
                <div class="circles-background">
                    <img src="./Imganes/UrbanHelp.jpeg" alt="Ícono de computadora portátil" class="laptop-icon">
                    </div>
            </div>

            <div class="login-form-container">
                <h1>Member Login</h1>
                <form>
                    <div class="input-group">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <label for="email-input" class="screen-reader-only">Correo Electrónico</label>
                        <input type="email" id="email-input" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <label for="password-input" class="screen-reader-only">Contraseña</label>
                        <input type="password" id="password-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-button">LOGIN</button>
                    <a href="#" class="forgot-password">Forgot Username / Password?</a>
                </form>
                <a href="#" class="create-account">Create your Account →</a>
            </div>
        </div>
    </div>
</body>
</html>
