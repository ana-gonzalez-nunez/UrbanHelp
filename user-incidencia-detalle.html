<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Incidencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>
  <script>if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function() {} };</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    #incidentMapView { min-height: 260px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">
  <div id="app"></div>

  <script src="user-data.js"></script>
  <script>
    function renderNotFound() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40 flex items-center justify-center px-4">
          <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Incidencia no encontrada</h2>
            <a href="user.html" class="text-blue-600 hover:text-blue-700">Volver al inicio</a>
          </div>
        </div>
      `;
    }

    function historyItem(update, index, total) {
      const color = update.status === 'pendiente'
        ? 'bg-yellow-500 text-yellow-700'
        : update.status === 'en-proceso'
          ? 'bg-blue-500 text-blue-700'
          : 'bg-green-500 text-green-700';

      const label = update.status === 'pendiente'
        ? 'Registrada'
        : update.status === 'en-proceso'
          ? 'En Proceso'
          : 'Resuelta';

      return `
        <div class="relative pb-6 ${index === total - 1 ? 'last:pb-0' : ''}">
          ${index < total - 1 ? '<div class="absolute left-2 top-5 bottom-0 w-0.5 bg-slate-200"></div>' : ''}
          <div class="relative flex items-start gap-3">
            <div class="w-4 h-4 rounded-full mt-1 flex-shrink-0 ${color.split(' ')[0]}"></div>
            <div class="flex-1">
              <span class="text-sm font-medium ${color.split(' ')[1]}">${label}</span>
              <p class="text-xs text-slate-500 mb-1">${formatDate(update.date)}</p>
              ${update.comment ? `<p class="text-sm text-slate-700 bg-slate-50 p-2 rounded-lg mt-2 border border-slate-200">${update.comment}</p>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderIncidentDetail(incident) {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">
          <div class="bg-white/90 backdrop-blur border-b border-slate-200/70 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 py-8">
              <a href="user.html" class="inline-flex items-center gap-2 text-slate-700 hover:text-slate-900 mb-4 font-medium bg-white border border-slate-300 px-3 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Volver al inicio
              </a>
              <div class="flex items-start justify-between gap-4">
                <div>
                  <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">${getCategoryLabel(incident.category)}</h1>
                  <p class="text-slate-600 mt-1">Incidencia #${incident.id}</p>
                </div>
                ${getStatusBadge(incident.status)}
              </div>
            </div>
          </div>

          <div class="max-w-4xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 space-y-6">
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                  <h2 class="text-xl font-semibold text-slate-900 mb-4">Información de la Incidencia</h2>
                  <div class="space-y-4">
                    <div>
                      <label class="text-sm font-medium text-slate-600">Descripción</label>
                      <p class="text-slate-900 mt-1">${incident.description}</p>
                    </div>

                    <div class="flex items-start gap-2">
                      <i data-lucide="map-pin" class="w-5 h-5 text-slate-400 mt-0.5 flex-shrink-0"></i>
                      <div>
                        <label class="text-sm font-medium text-slate-600">Ubicación</label>
                        <p class="text-slate-900 mt-1">${incident.location}</p>
                      </div>
                    </div>

                    <div>
                      <label class="text-sm font-medium text-slate-600 block mb-2">Punto en el mapa</label>
                      <div id="incidentMapView" class="w-full rounded-xl border border-slate-200 overflow-hidden"></div>
                    </div>

                    <div class="flex items-start gap-2">
                      <i data-lucide="calendar" class="w-5 h-5 text-slate-400 mt-0.5 flex-shrink-0"></i>
                      <div>
                        <label class="text-sm font-medium text-slate-600">Fecha de registro</label>
                        <p class="text-slate-900 mt-1">${formatDate(incident.createdAt)}</p>
                      </div>
                    </div>
                  </div>
                </div>

                ${incident.technicianComments && incident.technicianComments.length > 0 ? `
                  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center gap-2 mb-4">
                      <i data-lucide="message-square" class="w-5 h-5 text-slate-600"></i>
                      <h2 class="text-xl font-semibold text-slate-900">Comentarios del Técnico</h2>
                    </div>
                    <div class="space-y-3">
                      ${incident.technicianComments.map(comment => `
                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                          <p class="text-slate-900">${comment}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>

              <div class="lg:col-span-1">
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                  <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="clock" class="w-5 h-5 text-slate-600"></i>
                    <h2 class="text-xl font-semibold text-slate-900">Historial</h2>
                  </div>
                  <div class="relative">
                    ${incident.statusHistory.map((update, index) => historyItem(update, index, incident.statusHistory.length)).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function initMapView(incident) {
      const el = document.getElementById('incidentMapView');
      if (!el || typeof L === 'undefined') return;

      if (incident.geo && typeof incident.geo.lat === 'number') {
        const map = L.map('incidentMapView', { zoomControl: true, scrollWheelZoom: false })
          .setView([incident.geo.lat, incident.geo.lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        L.marker([incident.geo.lat, incident.geo.lng])
          .addTo(map)
          .bindPopup(incident.location || 'Ubicación de la incidencia')
          .openPopup();
      } else if (incident.location) {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(incident.location)}&limit=1`)
          .then(r => r.json())
          .then(results => {
            if (!results || results.length === 0) { el.classList.add('hidden'); return; }
            const lat = parseFloat(results[0].lat);
            const lng = parseFloat(results[0].lon);
            const map = L.map('incidentMapView', { zoomControl: true, scrollWheelZoom: false })
              .setView([lat, lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            L.marker([lat, lng])
              .addTo(map)
              .bindPopup(incident.location)
              .openPopup();
          })
          .catch(() => el.classList.add('hidden'));
      } else {
        el.classList.add('hidden');
      }
    }

    function render() {
      const id = new URLSearchParams(window.location.search).get('id');
      const incident = mockIncidents.find(i => i.id === id);
      document.getElementById('app').innerHTML = incident ? renderIncidentDetail(incident) : renderNotFound();
      lucide.createIcons();
      if (incident) initMapView(incident);
    }

    render();
  </script>
</body>
</html>
