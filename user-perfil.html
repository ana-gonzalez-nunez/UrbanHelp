<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>
  <script>if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function() {} };</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">
  <div class="bg-white/90 backdrop-blur border-b border-slate-200/70 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-8">
      <a href="user.html" class="inline-flex items-center gap-2 text-slate-700 hover:text-slate-900 mb-4 font-medium bg-white border border-slate-300 px-3 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Volver al inicio
      </a>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">Mi Perfil</h1>
      <p class="text-slate-600 mt-2">Consulta y actualiza tus datos personales</p>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="profileStats"></div>

    <form id="profileForm" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
      <h2 class="text-xl font-semibold text-slate-900 mb-6">Datos del usuario</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
          <input id="fullName" type="text" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
          <input id="email" type="email" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
          <input id="phone" type="text" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">Dirección</label>
          <input id="address" type="text" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Código Postal</label>
          <input id="postalCode" type="text" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Ciudad</label>
          <input id="city" type="text" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-300" required>
        </div>

        <div class="flex items-center gap-2 mt-2">
          <input id="notificationsEnabled" type="checkbox" class="w-4 h-4 rounded border-slate-300">
          <label for="notificationsEnabled" class="text-sm text-slate-700">Recibir notificaciones de cambios en incidencias</label>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <button type="submit" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold shadow-sm hover:bg-blue-700 transition-colors">
          <i data-lucide="save" class="w-4 h-4"></i>
          Guardar perfil
        </button>
        <button type="button" id="resetProfile" class="inline-flex items-center gap-2 bg-white text-slate-700 border border-slate-300 px-5 py-2.5 rounded-xl font-semibold shadow-sm hover:bg-slate-50 transition-colors">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Restablecer
        </button>
      </div>

      <p id="saveMessage" class="mt-4 text-sm text-emerald-700 hidden">Perfil guardado correctamente.</p>
    </form>
  </div>

  <script src="user-data.js"></script>
  <script>
    function statCard(title, value, valueClass, iconName, iconBgClass, iconClass) {
      return `
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">${title}</p>
              <p class="text-2xl font-extrabold ${valueClass}">${value}</p>
            </div>
            <div class="${iconBgClass} p-2.5 rounded-xl">
              <i data-lucide="${iconName}" class="w-5 h-5 ${iconClass}"></i>
            </div>
          </div>
        </div>
      `;
    }

    function fillForm(profile) {
      document.getElementById('fullName').value = profile.fullName || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('address').value = profile.address || '';
      document.getElementById('postalCode').value = profile.postalCode || '';
      document.getElementById('city').value = profile.city || '';
      document.getElementById('notificationsEnabled').checked = !!profile.notificationsEnabled;
    }

    function readForm() {
      return {
        ...getUserProfile(),
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        postalCode: document.getElementById('postalCode').value.trim(),
        city: document.getElementById('city').value.trim(),
        notificationsEnabled: document.getElementById('notificationsEnabled').checked
      };
    }

    function renderStats(profile) {
      const total = mockIncidents.length;
      const resolved = mockIncidents.filter(i => i.status === 'resuelta').length;
      const open = total - resolved;

      document.getElementById('profileStats').innerHTML = [
        statCard('Incidencias reportadas', total, 'text-slate-900', 'clipboard-list', 'bg-slate-100', 'text-slate-700'),
        statCard('Abiertas', open, 'text-blue-700', 'clock-3', 'bg-blue-100', 'text-blue-700'),
        statCard('Resueltas', resolved, 'text-emerald-700', 'check-circle-2', 'bg-emerald-100', 'text-emerald-700')
      ].join('');

      if (profile.fullName) {
        document.title = `Perfil - ${profile.fullName}`;
      }
    }

    function showSavedMessage() {
      const message = document.getElementById('saveMessage');
      message.classList.remove('hidden');
      setTimeout(() => message.classList.add('hidden'), 2500);
    }

    function init() {
      const profile = getUserProfile();
      fillForm(profile);
      renderStats(profile);

      document.getElementById('profileForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const updatedProfile = readForm();
        saveUserProfile(updatedProfile);
        renderStats(updatedProfile);
        showSavedMessage();
      });

      document.getElementById('resetProfile').addEventListener('click', () => {
        localStorage.removeItem('userProfile');
        const reset = getUserProfile();
        fillForm(reset);
        renderStats(reset);
      });

      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
