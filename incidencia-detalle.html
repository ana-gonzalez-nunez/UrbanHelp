            { id: 'INC009', title: 'Fugas de agua en Calle Norte', description: 'Se detectó fuga importante de agua potable en la acera.', category: 'Servicios e infraestructura', status: 'resuelta', priority: 'alta', location: 'Calle Norte, 156', citizenName: 'Valentina Costa', citizenEmail: 'valentina@email.com', citizenPhone: '+34 612 345 686', assignedTechnician: 'Miguel Ángel Torres', reportDate: '2026-02-15', assignedDate: '2026-02-15', actions: [ { id: 'A1', date: '15/02/2026 11:30', technician: 'Miguel Ángel Torres', action: 'Tubería reparada', comment: 'Fuga sellada correctamente' }, { id: 'A2', date: '15/02/2026 12:00', technician: 'Miguel Ángel Torres', action: 'Prueba de funcionamiento', comment: 'Sistema funcionando correctamente' } ] },

        ];

        function getStatusColor(status) {
            if (status === 'resuelta') return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-400' };
            if (status === 'en proceso') return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-400' };
            return { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-400' };
        }

        function getPriorityColor(priority) {
            if (priority === 'alta') return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-400' };
            if (priority === 'media') return { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-400' };
            return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-400' };
        }

        function getPriorityBadge(priority) {
            const colors = getPriorityColor(priority);
            return `<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${colors.bg} ${colors.text} border ${colors.border}">${priority.charAt(0).toUpperCase() + priority.slice(1)}</span>`;
        }

        function getStatusBadge(status) {
            const colors = getStatusColor(status);
            const label = status.charAt(0).toUpperCase() + status.slice(1);
            return `<span class="inline-block px-3 py-1 rounded-lg text-xs font-semibold ${colors.bg} ${colors.text} border ${colors.border}">${label}</span>`;
        }

        function renderNotFound() {
            return `
                <div class="max-w-3xl mx-auto pt-10 pb-20 px-4">
                    <div class="bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200/60 fade-in">

                        <p class="text-slate-600 mt-2">No se encontró la incidencia solicitada o falta el parámetro id.</p>
                        <a href="tecnico.html" class="inline-flex items-center gap-2 mt-6 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-colors">
                            <i data-lucide="arrow-left" class="h-4 w-4"></i>
                            Volver al listado
                        </a>
                    </div>
                </div>
            `;
        }

        function renderIncidentDetail(incident) {
            const daysElapsed = Math.floor((new Date() - new Date(incident.reportDate)) / (1000 * 60 * 60 * 24));
            const incidentCode = incident.id.startsWith('INC-') ? incident.id : `INC-${incident.id.replace(/[^0-9]/g, '').padStart(3, '0')}`;

            return `
                <div class="max-w-7xl mx-auto space-y-6 pt-8 pb-20 px-4 sm:px-6">
                    <div class="bg-white rounded-2xl shadow-xl border border-slate-200/70 p-5 sm:p-6 fade-in">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex items-start gap-4 min-w-0">
                                <a href="tecnico.html" class="mt-0.5 inline-flex items-center justify-center w-9 h-9 rounded-full border border-slate-200 hover:bg-slate-50 text-slate-700 transition-colors">

                                </a>
                                <div class="min-w-0">
                                    <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600 truncate">Incidencia ${incidentCode}</h1>
                                    <p class="text-slate-600 mt-1">Gestión y seguimiento de incidencia</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                ${getPriorityBadge(incident.priority)}

                            </div>
                        </div>
                    </div>

                    <div class="grid gap-6 lg:grid-cols-3 fade-in">
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-white rounded-2xl shadow-lg border border-slate-200/70 overflow-hidden">
                                <div class="bg-gradient-to-r from-indigo-50 via-blue-50 to-purple-50 border-b border-indigo-100 p-6">
                                    <h3 class="flex items-center gap-2 text-xl font-bold text-slate-900">
                                        <i data-lucide="file-text" class="h-5 w-5 text-indigo-600"></i>
                                        Detalles de la Incidencia
                                    </h3>
                                    <p class="text-slate-600 mt-1">Información reportada por el ciudadano</p>
                                </div>
                                <div class="p-6 space-y-6">
                                    <div class="grid gap-6 sm:grid-cols-2">
                                        <div class="space-y-2">
                                            <p class="text-sm font-semibold text-slate-500 flex items-center gap-2">
                                                <i data-lucide="map-pin" class="h-4 w-4 text-indigo-500"></i>
                                                Ubicación
                                            </p>
                                            <p class="font-bold text-slate-900 pl-6">${incident.location}</p>
                                        </div>
                                        <div class="space-y-2">
                                            <p class="text-sm font-semibold text-slate-500 flex items-center gap-2">
                                                <i data-lucide="calendar" class="h-4 w-4 text-violet-500"></i>
                                                Fecha de reporte
                                            </p>
                                            <p class="font-bold text-slate-900 pl-6">${new Date(incident.reportDate).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                        </div>
                                        <div class="space-y-2">
                                            <p class="text-sm font-semibold text-slate-500">Categoría</p>
                                            <div class="flex items-center gap-2">

                                                    <i data-lucide="file-check" class="h-4 w-4 text-emerald-600"></i>
                                                </div>
                                                <p class="font-bold text-slate-900">${incident.category}</p>
                                            </div>
                                        </div>
                                        <div class="space-y-2">
                                            <p class="text-sm font-semibold text-slate-500">Prioridad</p>
                                            <div>${getPriorityBadge(incident.priority)}</div>
                                        </div>
                                    </div>

                                    <div class="border-t border-slate-200 pt-5 space-y-3">

                                            Descripción completa

                                            <p class="text-slate-700 leading-relaxed">${incident.description}</p>
                                        </div>
                                    </div>
                                </div>

                            <div class="bg-white rounded-2xl shadow-lg border border-slate-200/70 overflow-hidden">

                                            </div>
                                            <p class="text-slate-500 font-medium">No hay actuaciones registradas</p>
                                        </div>
                                    ` : `
                                        <div class="space-y-8">
                                            ${incident.actions.map((action, index) => `
                                                <div class="relative pl-10">
                                                    ${index < incident.actions.length - 1 ? '<div class="absolute left-4 top-8 h-[calc(100%+24px)] w-0.5 bg-indigo-200"></div>' : ''}

                                                        <i data-lucide="check-circle-2" class="h-3 w-3 text-white"></i>
                                                    </div>
                                                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">

                                                            <span class="inline-flex items-center gap-1">
                                                                <i data-lucide="user" class="h-3.5 w-3.5"></i>
                                                                ${action.technician}
                                                            </span>
                                                            <span>•</span>
                                                            <span class="inline-flex items-center gap-1">
                                                                <i data-lucide="clock-3" class="h-3.5 w-3.5"></i>
                                                                ${action.date}
                                                            </span>
                                                        </p>
                                                        ${action.comment ? `
                                                            <div class="mt-3 bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3">
                                                                <p class="text-slate-700">${action.comment}</p>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `}
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl shadow-lg border border-slate-200/70 overflow-hidden">
                                <div class="bg-gradient-to-r from-emerald-50 via-teal-50 to-cyan-50 border-b border-emerald-100 p-6">
                                    <h3 class="flex items-center gap-2 text-xl font-bold text-slate-900">
                                        <i data-lucide="user-round" class="h-5 w-5 text-emerald-600"></i>
                                        Información del Ciudadano
                                    </h3>
                                    <p class="text-slate-600 mt-1">Datos de contacto del reportante</p>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl p-3">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="user" class="h-4 w-4 text-slate-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-slate-500">Nombre completo</p>
                                            <p class="font-bold text-slate-900">${incident.citizenName}</p>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl p-3">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="mail" class="h-4 w-4 text-indigo-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-slate-500">Correo electrónico</p>
                                            <a href="mailto:${incident.citizenEmail}" class="font-semibold text-indigo-600 hover:underline">${incident.citizenEmail}</a>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-xl p-3">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="phone" class="h-4 w-4 text-emerald-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-slate-500">Teléfono</p>
                                            <a href="tel:${incident.citizenPhone}" class="font-semibold text-indigo-600 hover:underline">${incident.citizenPhone}</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white rounded-2xl shadow-lg border border-slate-200/70 overflow-hidden">
                                <div class="bg-gradient-to-r from-amber-50 via-orange-50 to-rose-50 border-b border-amber-100 p-6">
                                    <h3 class="flex items-center gap-2 text-xl font-bold text-slate-900">
                                        <i data-lucide="clipboard-check" class="h-5 w-5 text-amber-600"></i>
                                        Gestión de Incidencia
                                    </h3>
                                    <p class="text-slate-600 mt-1">Actualizar estado y registrar acciones</p>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div class="space-y-2">
                                        <label class="text-sm font-semibold text-slate-700">Estado de la incidencia</label>
                                        <select class="w-full px-4 py-2 border-2 border-slate-200 rounded-lg bg-slate-50 hover:border-indigo-300 transition-colors">
                                            <option value="pendiente" ${incident.status === 'pendiente' ? 'selected' : ''}>● Pendiente</option>
                                            <option value="en proceso" ${incident.status === 'en proceso' ? 'selected' : ''}>● En proceso</option>
                                            <option value="resuelta" ${incident.status === 'resuelta' ? 'selected' : ''}>● Resuelta</option>
                                        </select>
                                    </div>

                                    <div class="border-t border-slate-200"></div>

                                    <div class="space-y-2">
                                        <label class="text-sm font-semibold text-slate-700">Acción realizada</label>
                                        <textarea rows="2" placeholder="Ej: Inspección inicial, Reparación completada..." class="w-full px-4 py-2 border-2 border-slate-200 rounded-lg bg-slate-50 hover:border-indigo-300 transition-colors resize-none"></textarea>
                                    </div>

                                    <div class="space-y-2">
                                        <label class="text-sm font-semibold text-slate-700">Comentario de seguimiento</label>
                                        <textarea rows="3" placeholder="Añade notas sobre el progreso o detalles importantes..." class="w-full px-4 py-2 border-2 border-slate-200 rounded-lg bg-slate-50 hover:border-indigo-300 transition-colors resize-none"></textarea>
                                    </div>

                                    <button class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white px-4 py-3 rounded-lg shadow-md transition-all font-semibold">
                                        <i data-lucide="save" class="h-4 w-4"></i>
                                        Guardar cambios
                                    </button>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl shadow-lg border border-slate-200/70 overflow-hidden">
                                <div class="bg-gradient-to-r from-slate-50 to-blue-50 border-b p-6">
                                    <h3 class="flex items-center gap-2 text-xl font-bold text-slate-900">
                                        <i data-lucide="clock-3" class="h-5 w-5 text-slate-600"></i>
                                        Información Adicional
                                    </h3>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div class="flex items-start gap-3 p-3 bg-blue-50 border border-blue-100 rounded-xl">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="calendar-check" class="h-4 w-4 text-blue-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm font-semibold text-slate-700">Fecha de asignación</p>
                                            <p class="text-slate-600 text-sm">${incident.assignedDate ? new Date(incident.assignedDate).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : 'No asignada'}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-3 p-3 bg-purple-50 border border-purple-100 rounded-xl">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="calendar-days" class="h-4 w-4 text-purple-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-sm font-semibold text-slate-700">Días desde reporte</p>
                                            <p class="text-purple-700 font-bold text-xl">${daysElapsed} días</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            const id = new URLSearchParams(window.location.search).get('id');
            const incident = mockIncidents.find(i => i.id === id);
            app.innerHTML = incident ? renderIncidentDetail(incident) : renderNotFound();
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
