<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Incidencias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.439.0/dist/umd/lucide.min.js"></script>
  <script>if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function() {} };</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">
  <div class="bg-white/90 backdrop-blur border-b border-slate-200/70 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <a href="user.html" class="inline-flex items-center gap-2 text-slate-700 hover:text-slate-900 mb-4 font-medium bg-white border border-slate-300 px-3 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Volver al inicio
      </a>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">Historial de Incidencias</h1>
      <p class="text-slate-600 mt-2">Consulta todas tus incidencias reportadas</p>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="filter" class="w-5 h-5 text-slate-600"></i>
        <h2 class="font-semibold text-slate-900">Filtrar por estado</h2>
      </div>
      <div class="flex flex-wrap gap-2" id="filterButtons"></div>
    </div>

    <div class="space-y-4" id="incidentsList"></div>
  </div>

  <script src="user-data.js"></script>
  <script>
    let selectedFilter = 'todas';

    function getFilterButtonClass(value) {
      if (selectedFilter === value) {
        if (value === 'pendiente') return 'bg-yellow-600 text-white';
        if (value === 'en-proceso') return 'bg-blue-600 text-white';
        if (value === 'resuelta') return 'bg-green-600 text-white';
        return 'bg-blue-600 text-white';
      }
      return 'bg-slate-100 text-slate-700 hover:bg-slate-200';
    }

    function renderFilters() {
      const pending = mockIncidents.filter(i => i.status === 'pendiente').length;
      const inProgress = mockIncidents.filter(i => i.status === 'en-proceso').length;
      const resolved = mockIncidents.filter(i => i.status === 'resuelta').length;

      document.getElementById('filterButtons').innerHTML = `
        <button onclick="setFilter('todas')" class="px-4 py-2 rounded-xl font-semibold shadow-sm transition-colors ${getFilterButtonClass('todas')}">Todas (${mockIncidents.length})</button>
        <button onclick="setFilter('pendiente')" class="px-4 py-2 rounded-xl font-semibold shadow-sm transition-colors ${getFilterButtonClass('pendiente')}">Pendientes (${pending})</button>
        <button onclick="setFilter('en-proceso')" class="px-4 py-2 rounded-xl font-semibold shadow-sm transition-colors ${getFilterButtonClass('en-proceso')}">En Proceso (${inProgress})</button>
        <button onclick="setFilter('resuelta')" class="px-4 py-2 rounded-xl font-semibold shadow-sm transition-colors ${getFilterButtonClass('resuelta')}">Resueltas (${resolved})</button>
      `;
    }

    function renderList() {
      const filtered = selectedFilter === 'todas'
        ? mockIncidents
        : mockIncidents.filter(i => i.status === selectedFilter);

      const list = document.getElementById('incidentsList');
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center shadow-sm">
            <p class="text-slate-600">No se encontraron incidencias con este filtro</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(renderIncidentCard).join('');
    }

    function setFilter(filter) {
      selectedFilter = filter;
      renderFilters();
      renderList();
      lucide.createIcons();
    }

    function render() {
      renderFilters();
      renderList();
      lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
