services:
  db:
    image: postgres:16-alpine
    container_name: proyectos2-db
    environment:
      POSTGRES_DB: proyectos2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyectos2"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyectos2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/proyectos2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: proyectos2-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
