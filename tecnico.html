            if (status === 'resuelta') return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-400' };
            if (status === 'en proceso') return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-400' };
            return { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-400' };
        }

        function getPriorityColor(priority) {
            if (priority === 'alta') return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-400' };
            if (priority === 'media') return { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-400' };
            return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-400' };
        }

            return mockIncidents.filter(inc => {
                const statusMatch = statusFilter === 'todos' || inc.status === statusFilter;
                const categoryMatch = categoryFilter === 'todos' || inc.category === categoryFilter;
                return statusMatch && categoryMatch;
            });
        }

            const colors = getPriorityColor(priority);

            </span>`;
        }

            const colors = getStatusColor(status);
            const label = status.charAt(0).toUpperCase() + status.slice(1);
            return `<span class="inline-block px-3 py-1 rounded-lg text-xs font-semibold ${colors.bg} ${colors.text} border ${colors.border}">

            </span>`;

                categoryStats[inc.category]++;

                                        <th class="px-6 py-4 font-bold text-slate-700 text-sm">Categoría</th>
                                        <th class="px-6 py-4 font-bold text-slate-700 text-sm">Ubicación</th>
                                        <th class="px-6 py-4 font-bold text-slate-700 text-sm">Prioridad</th>
                                        <th class="px-6 py-4 font-bold text-slate-700 text-sm">Estado</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${filtered.length === 0 ? `
                                        <tr>
                                            <td colspan="6" class="text-center text-slate-500 py-12">
                                                <div class="flex flex-col items-center gap-2">
                                                    <i data-lucide="filter" class="h-12 w-12 text-slate-300"></i>
                                                    <p class="font-medium">No se encontraron incidencias</p>
                                                    <p class="text-sm">Intenta cambiar los filtros seleccionados</p>
                                                </div>
                                            </td>
                                        </tr>
                                    ` : filtered.map(incident => `
                                        <tr onclick="openIncident('${incident.id}')" class="cursor-pointer hover:bg-indigo-50/50 transition-colors border-b">
                                            <td class="px-6 py-4 font-bold text-indigo-600">${incident.id}</td>
                                            <td class="px-6 py-4">
                                                <span class="text-sm font-medium text-slate-700">${incident.category}</span>
                                            </td>
                                            <td class="px-6 py-4 text-slate-600">${incident.location}</td>
                                            <td class="px-6 py-4">${getPriorityBadge(incident.priority)}</td>
                                            <td class="px-6 py-4">${getStatusBadge(incident.status)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderIncidentDetail() {
            const incident = mockIncidents.find(i => i.id === selectedIncidentId);
            if (!incident) return '';

            const daysElapsed = Math.floor((new Date() - new Date(incident.reportDate)) / (1000 * 60 * 60 * 24));

            return `
                <div class="max-w-6xl mx-auto space-y-6 pt-8 pb-20">
                    <!-- Header -->
                    <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-200/60 fade-in">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div class="flex items-center gap-3">
                                    <div>
                                    <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 via-blue-600 to-cyan-600 bg-clip-text text-transparent">
                                        Incidencia ${incident.id}
                                    </h1>
                                    <p class="text-slate-600 mt-1">Gestión y seguimiento de incidencia</p>
                                    </div>
                            </div>
                            <div class="flex gap-3 items-center">
                                ${getPriorityBadge(incident.priority)}
                                ${getStatusBadge(incident.status)}
                            </div>
                        </div>
                    </div>

                    <div class="grid gap-6 lg:grid-cols-3">
                        <!-- Main Content -->
                        <div class="lg:col-span-2 space-y-6">
                            <!-- Incident Details -->
                            <div class="bg-white rounded-2xl shadow-lg border-0 overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                <div class="bg-gradient-to-r from-indigo-50 via-blue-50 to-purple-50 border-b border-indigo-100 p-6">
                                    <h3 class="flex items-center gap-2 text-lg font-bold">
                                        
                                        Detalles de la Incidencia
                                    </h3>
                                    <p class="text-slate-600 text-sm mt-1">Información reportada por el ciudadano</p>
                                </div>
                                <div class="p-6 space-y-6">
                                    <div class="grid gap-6 sm:grid-cols-2">
                                        <div class="space-y-2">
                                            <div class="flex items-center gap-2 text-sm font-medium text-slate-500">
                                                
                                                <span>Ubicación</span>
                                            </div>
                                            <p class="font-semibold text-slate-900 pl-8">${incident.location}</p>
                                        </div>
                                        <div class="space-y-2">
                                            <div class="flex items-center gap-2 text-sm font-medium text-slate-500">
                                                
                                                <span>Fecha de reporte</span>
                                            </div>
                                            <p class="font-semibold text-slate-900 pl-8">${new Date(incident.reportDate).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-slate-500 text-sm">Categoría</label>
                                            <div class="flex items-center gap-2">
                                                <div class="p-2 bg-emerald-100 rounded-lg">
                                                    <i data-lucide="file-text" class="h-4 w-4 text-emerald-600"></i>
                                                </div>
                                                <p class="font-semibold text-slate-900">${incident.category}</p>
                                            </div>
                                        </div>
                                        <div class="space-y-2">
                                            <label class="text-slate-500 text-sm">Prioridad</label>
                                            <div>${getPriorityBadge(incident.priority)}</div>
                                        </div>
                                    </div>

                                    <div class="border-t border-slate-200 pt-6"></div>

                                    <div class="space-y-3">
                                        <label class="text-slate-700 flex items-center gap-2 font-semibold">
                                            <i data-lucide="alert-circle" class="h-4 w-4"></i>
                                            Descripción completa
                                        </label>
                                        <div class="bg-gradient-to-br from-slate-50 to-indigo-50 p-4 rounded-lg border border-slate-200">
                                            <p class="text-slate-700 leading-relaxed">${incident.description}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Citizen Information -->
                            <div class="bg-white rounded-2xl shadow-lg border-0 overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                <div class="bg-gradient-to-r from-emerald-50 via-teal-50 to-cyan-50 border-b border-emerald-100 p-6">
                                    <h3 class="flex items-center gap-2 text-lg font-bold">
                                        
                                        Información del Ciudadano
                                    </h3>
                                    <p class="text-slate-600 text-sm mt-1">Datos de contacto del reportante</p>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg hover:bg-slate-100 transition-colors">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="user" class="h-5 w-5 text-slate-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-slate-500">Nombre completo</p>
                                            <span class="font-semibold text-slate-900">${incident.citizenName}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg hover:bg-slate-100 transition-colors">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="mail" class="h-5 w-5 text-indigo-600"></i>
                                        </div>
                                        <div class="flex-1">
                                            <p class="text-xs text-slate-500">Correo electrónico</p>
                                            <a href="mailto:${incident.citizenEmail}" class="text-indigo-600 hover:underline font-medium">${incident.citizenEmail}</a>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg hover:bg-slate-100 transition-colors">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="phone" class="h-5 w-5 text-emerald-600"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-slate-500">Teléfono</p>
                                            <a href="tel:${incident.citizenPhone}" class="text-indigo-600 hover:underline font-medium">${incident.citizenPhone}</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- History -->
                            <div class="bg-white rounded-2xl shadow-lg border-0 overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                <div class="bg-gradient-to-r from-purple-50 to-blue-50 border-b p-6">
                                    <h3 class="flex items-center gap-2 text-lg font-bold">
                                        
                                        Historial de Actuaciones
                                    </h3>
                                    <p class="text-slate-600 text-sm mt-1">Registro cronológico de acciones del técnico</p>
                                </div>
                                <div class="p-6">
                                    ${incident.actions.length === 0 ? `
                                        <div class="text-center py-12">
                                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4">
                                                <i data-lucide="clock" class="h-8 w-8 text-gray-400"></i>
                                            </div>
                                            <p class="text-gray-500 font-medium">No hay actuaciones registradas aún</p>
                                            <p class="text-sm text-gray-400 mt-1">Las acciones aparecerán aquí cuando se registren</p>
                                        </div>
                                    ` : `
                                        <div class="space-y-6">
                                            ${incident.actions.map((action, index) => `
                                                <div class="relative pl-8 pb-6">
                                                    ${index < incident.actions.length - 1 ? '<div class="absolute left-3 top-8 bottom-0 w-0.5 bg-gradient-to-b from-blue-300 to-purple-300"></div>' : ''}
                                                    <div class="absolute left-0 top-1 h-6 w-6 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 border-4 border-white shadow-md flex items-center justify-center">
                                                        <i data-lucide="check-circle" class="h-3 w-3 text-white"></i>
                                                    </div>
                                                    <div class="bg-white rounded-lg p-4 shadow-md border border-gray-100 hover:border-blue-200 transition-colors">
                                                        <div class="mb-2">
                                                            <p class="font-bold text-gray-900">${action.action}</p>
                                                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                                                <div class="flex items-center gap-1 text-xs text-gray-500 bg-gray-50 px-2 py-1 rounded">
                                                                    <i data-lucide="user" class="h-3 w-3"></i>
                                                                    ${action.technician}
                                                                </div>
                                                                <span class="text-gray-300">•</span>
                                                                <div class="flex items-center gap-1 text-xs text-gray-500 bg-gray-50 px-2 py-1 rounded">
                                                                    <i data-lucide="clock" class="h-3 w-3"></i>
                                                                    ${action.date}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        ${action.comment ? `
                                                            <div class="mt-3 bg-gradient-to-br from-blue-50 to-purple-50 p-3 rounded-md border border-blue-100">
                                                                <p class="text-sm text-gray-700 leading-relaxed">${action.comment}</p>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar -->
                        <div class="space-y-6 lg:sticky lg:top-6 self-start h-fit">
                            <!-- Management Actions -->
                            <div class="bg-white rounded-2xl shadow-lg border-0">
                                <div class="bg-gradient-to-r from-amber-50 via-orange-50 to-rose-50 border-b border-amber-100 p-6">
                                    <h3 class="flex items-center gap-2 text-lg font-bold">
                                        
                                        Gestión de Incidencia
                                    </h3>
                                    <p class="text-slate-600 text-sm mt-1">Actualizar estado y registrar acciones</p>
                                </div>
                                <div class="p-6 space-y-5">
                                    <div class="space-y-3">
                                        <label class="text-sm font-semibold text-slate-700 block">Estado de la incidencia</label>
                                        <select class="w-full px-4 py-2 border-2 border-slate-300 rounded-lg hover:border-indigo-300 transition-colors">
                                            <option value="pendiente" ${incident.status === 'pendiente' ? 'selected' : ''}>● Pendiente</option>
                                            <option value="en proceso" ${incident.status === 'en proceso' ? 'selected' : ''}>● En proceso</option>
                                            <option value="resuelta" ${incident.status === 'resuelta' ? 'selected' : ''}>● Resuelta</option>
                                        </select>
                                    </div>

                                    <div class="border-t border-slate-200"></div>

                                    <div class="space-y-3">
                                        <label class="text-sm font-semibold text-slate-700 block">Acción realizada</label>
                                        <textarea placeholder="Ej: Inspección inicial, Reparación completada..." rows="2" class="w-full px-4 py-2 border-2 border-slate-300 rounded-lg hover:border-indigo-300 focus:border-indigo-400 transition-colors resize-none"></textarea>
                                    </div>

                                    <div class="space-y-3">
                                        <label class="text-sm font-semibold text-slate-700 block">Comentario de seguimiento</label>
                                        <textarea placeholder="Añade notas sobre el progreso o detalles importantes..." rows="4" class="w-full px-4 py-2 border-2 border-slate-300 rounded-lg hover:border-indigo-300 focus:border-indigo-400 transition-colors resize-none"></textarea>
                                    </div>

                                    <button class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg shadow-md hover:shadow-lg transition-all font-semibold flex items-center justify-center gap-2">
                                        <i data-lucide="save" class="h-5 w-5"></i>
                                        Guardar cambios
                                    </button>
                                </div>
                            </div>

                            <!-- Quick Info -->
                            <div class="bg-white rounded-2xl shadow-lg border-0">
                                <div class="bg-gradient-to-r from-gray-50 to-blue-50 border-b p-6">
                                    <h3 class="flex items-center gap-2 text-lg font-bold">
                                        <div class="p-2 bg-gray-100 rounded-lg">
                                            <i data-lucide="clock" class="h-5 w-5 text-gray-600"></i>
                                        </div>
                                        Información Adicional
                                    </h3>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div class="flex items-start gap-3 p-3 bg-blue-50 rounded-lg">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="clock" class="h-5 w-5 text-blue-600"></i>
                                        </div>
                                        <div>
                                            <p class="font-semibold text-gray-700 text-sm">Fecha de asignación</p>
                                            <p class="text-gray-600 text-sm mt-0.5">${incident.assignedDate ? new Date(incident.assignedDate).toLocaleDateString('es-ES') : 'No asignada'}</p>
                                        </div>
                                    </div>
                                    <div class="border-t border-slate-200"></div>
                                    <div class="flex items-start gap-3 p-3 bg-purple-50 rounded-lg">
                                        <div class="p-2 bg-white rounded-lg shadow-sm">
                                            <i data-lucide="calendar" class="h-5 w-5 text-purple-600"></i>
                                        </div>
                                        <div>
                                            <p class="font-semibold text-gray-700 text-sm">Días desde reporte</p>
                                            <p class="text-purple-600 font-bold text-lg mt-0.5">${daysElapsed} días</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openIncident(id) {
            selectedIncidentId = id;
            currentPage = 'detail';
            history.pushState({ page: 'detail', incidentId: id }, '', `#incidencia-${id}`);
            render();
        }

        function goBackFromDetail() {
            if (currentPage === 'detail') {
                history.back();
                return;
            }
            currentPage = 'dashboard';
            render();
        }

        window.onpopstate = function(event) {
            if (event.state && event.state.page === 'detail' && event.state.incidentId) {
                selectedIncidentId = event.state.incidentId;
                currentPage = 'detail';
            } else {
                selectedIncidentId = null;
                currentPage = 'dashboard';
            }
            render();
        };

        function initChart() {
            const priorityData = {
                alta: mockIncidents.filter(i => i.priority === 'alta').length,
                media: mockIncidents.filter(i => i.priority === 'media').length,
                baja: mockIncidents.filter(i => i.priority === 'baja').length
            };

            const canvas = document.getElementById('priorityChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Alta', 'Media', 'Baja'],
                    datasets: [{
                        data: [
                            priorityData.alta,
                            priorityData.media,
                            priorityData.baja
                        ],
                        backgroundColor: [
                            '#f87171', // Alta
                            '#fbbf24', // Media
                            '#34d399'  // Baja
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '65%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15,23,42,0.9)',
                            callbacks: {
                                label: ctx =>
                                    `${ctx.label}: ${ctx.raw} incidencia${ctx.raw !== 1 ? 's' : ''}`
                            }
                        }
                    }
                }
            });
        }



        function render() {
            const app = document.getElementById('app');
            const content = currentPage === 'dashboard' ? renderDashboard() : renderIncidentDetail();
            app.innerHTML = content;
            lucide.createIcons();
            if (currentPage === 'dashboard') {
                setTimeout(initChart, 300);
            }
        }

        // Initial render
        history.replaceState({ page: 'dashboard' }, '', window.location.pathname);
        render();
    </script>
</body>
</html>
