<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Nueva Incidencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/latest/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">
  <div id="app"></div>

  <script src="user-data.js"></script>
  <script>
    let imageName = '';

    const categories = [
      'limpieza',
      'alumbrado',
      'vias-publicas',
      'transporte',
      'mobiliario-urbano'
    ];

    function renderSuccess() {
      return `
        <div class="min-h-screen flex items-center justify-center px-4">
          <div class="bg-white border border-slate-200 rounded-2xl p-8 max-w-md w-full text-center shadow-lg">
            <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="check-circle" class="w-8 h-8 text-green-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">¡Incidencia Enviada!</h2>
            <p class="text-slate-600">Tu reporte ha sido registrado correctamente. Te mantendremos informado del progreso.</p>
          </div>
        </div>
      `;
    }

    function renderForm() {
      return `
        <div class="bg-white/90 backdrop-blur border-b border-slate-200/70 shadow-sm">
          <div class="max-w-3xl mx-auto px-4 py-8">
            <a href="user.html" class="inline-flex items-center gap-2 text-slate-700 hover:text-slate-900 mb-4 font-medium bg-white border border-slate-300 px-3 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition-colors">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              Volver al inicio
            </a>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">Registrar Nueva Incidencia</h1>
            <p class="text-slate-600 mt-2">Completa el formulario para reportar un problema en tu ciudad</p>
          </div>
        </div>

        <div class="max-w-3xl mx-auto px-4 py-8">
          <form id="newIncidentForm" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-900 mb-2">Categoría *</label>
              <select id="category" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Selecciona una categoría</option>
                ${categories.map(cat => `<option value="${cat}">${getCategoryLabel(cat)}</option>`).join('')}
              </select>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-900 mb-2">Descripción del problema *</label>
              <textarea id="description" required rows="4" placeholder="Describe detalladamente el problema que has detectado..." class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-900 mb-2">Ubicación *</label>
              <div class="relative">
                <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                <input id="location" type="text" required placeholder="Ej: Calle Mayor, 45" class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              </div>
              <p class="text-sm text-slate-500 mt-1">Indica la dirección o ubicación aproximada del problema</p>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-900 mb-2">Imagen (opcional)</label>
              <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                <i data-lucide="upload" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
                <label class="cursor-pointer">
                  <span class="text-blue-600 hover:text-blue-700 font-medium">Haz clic para subir</span>
                  <span class="text-slate-600"> o arrastra una imagen aquí</span>
                  <input id="image" type="file" accept="image/*" class="hidden" />
                </label>
                <p id="imageName" class="text-sm text-slate-600 mt-2 ${imageName ? '' : 'hidden'}">Archivo seleccionado: ${imageName}</p>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
              <button type="submit" class="flex-1 inline-flex items-center justify-center gap-2 bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 transition-all font-semibold shadow-sm hover:shadow-md">
                <i data-lucide="send" class="w-4 h-4"></i>
                Enviar Incidencia
              </button>
              <a href="user.html" class="inline-flex items-center justify-center px-6 py-3 border border-slate-300 rounded-xl hover:bg-slate-50 transition-all font-semibold text-slate-700 shadow-sm hover:shadow-md">Cancelar</a>
            </div>
          </form>
        </div>
      `;
    }

    function bindFormEvents() {
      const imageInput = document.getElementById('image');
      const form = document.getElementById('newIncidentForm');

      imageInput.addEventListener('change', function(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        imageName = file.name;
        const imageNameElement = document.getElementById('imageName');
        imageNameElement.textContent = `Archivo seleccionado: ${imageName}`;
        imageNameElement.classList.remove('hidden');
      });

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        document.getElementById('app').innerHTML = renderSuccess();
        lucide.createIcons();
        setTimeout(() => {
          window.location.href = 'user.html';
        }, 2000);
      });
    }

    function render() {
      document.getElementById('app').innerHTML = renderForm();
      lucide.createIcons();
      bindFormEvents();
    }

    render();
  </script>
</body>
</html>
